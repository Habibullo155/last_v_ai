services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiback_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env перед запуском (см. .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-aiback}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Порт НЕ пробрасывается наружу (нет секции ports) — Postgres доступен
    # только внутри docker-сети, бэкенду, а не всему интернету. Если нужен
    # прямой доступ снаружи для отладки — используй `docker compose exec db psql`
    # вместо того, чтобы открывать порт наружу.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiback_app} -d ${POSTGRES_DB:-aiback}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # На Linux host.docker.internal не работает "из коробки" — добавлено
      # через extra_hosts ниже. На Docker Desktop (Mac/Windows) работает сразу.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiback_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aiback}
      SECRET_KEY: ${SECRET_KEY:?Задай SECRET_KEY в .env перед запуском (см. .env.example)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      TARIFF_FREE_MONTHLY_TOKENS: ${TARIFF_FREE_MONTHLY_TOKENS:-50000}
      TARIFF_PRO_MONTHLY_TOKENS: ${TARIFF_PRO_MONTHLY_TOKENS:-500000}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway" # нужно для Linux; Docker Desktop добавляет это сам
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pg_data:
