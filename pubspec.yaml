name: ai_last_v
description: "AI чат (Gemma 4 E2B через локальный Ollama + FastAPI) с эффектом глазморфизма, адаптивный для мобильных, планшетов, десктопа и веба."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  intl: ^0.20.2
  file_picker: ^8.1.3
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  image_picker: ^1.2.3
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

# Иконка приложения на всех платформах — генерируется командой:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B0F1E"
    theme_color: "#6C5CE7"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
