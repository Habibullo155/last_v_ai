name: Deploy Flutter Web to GitHub Pages

# Собирает веб-версию приложения и публикует на GitHub Pages при каждом
# пуше в main. Адрес бэкенда берётся из репозиторного секрета BACKEND_URL
# (Settings → Secrets and variables → Actions → New repository secret).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build web (with backend URL baked in)
        run: |
          flutter build web --release \
            --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }} \
            --base-href /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
