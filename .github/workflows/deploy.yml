name: Build All Platforms & Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # 1. Веб (сразу подготавливаем для Pages)
      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }} \
            --base-href /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # 2. Android APK
      - name: Build Android
        run: flutter build apk --release --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 3. Linux
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev pkg-config
      - name: Build Linux
        run: flutter build linux --release --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: build/linux/x64/release/bundle

  # Отдельный процесс для публикации сайта
  deploy-web:
    needs: build-ubuntu
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Сборка под Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      
      - name: Build Windows
        run: flutter build windows --release --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows/x64/runner/Release

  # Сборка под macOS
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      
      - name: Build macOS
        run: flutter build macos --release --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }}
      
      # Упаковываем .app в архив, чтобы GitHub не сломал права доступа к файлам
      - name: Zip macOS App
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app macos-app.zip
      
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos-app.zip